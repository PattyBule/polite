<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoliteText | AI Tone Polisher</title>
    <!-- 引入扣子 SDK -->
    <script src="https://lf-cdn.coze.cn/obj/unpkg/flow-platform/chat-app-sdk/1.2.0-beta.19/libs/cn/index.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f7f9fc; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; }
        
        /* 隐藏 SDK 默认的浮动小气泡，我们要用全屏 */
        #coze-chat-container { flex: 1; width: 100%; position: relative; }
        
        /* 强行让扣子的聊天框铺满全屏 */
        div[style*="position: fixed"] {
            width: 100% !important; height: 100vh !important;
            top: 0 !important; left: 0 !important; bottom: 0 !important; right: 0 !important;
            max-width: none !important; border-radius: 0 !important; z-index: 999999 !important;
        }
    </style>
</head>
<body>

    <!-- 聊天窗口容器 -->
    <div id="coze-chat-container"></div>

    <script>
        new CozeWebSDK.WebChatClient({
            config: {
                bot_id: '7700979632833052707', // 你的扣子 Bot ID
            },
            componentProps: {
                title: 'PoliteText',
            },
            auth: {
                type: 'token',
                // 👇👇👇 把下面这两处替换成你刚才复制的 pat_ 开头的长代码！👇👇👇
                token: '<script src="https://lf-cdn.coze.cn/obj/unpkg/flow-platform/chat-app-sdk/1.2.0-beta.19/libs/cn/index.js"></script>
<script>
  new CozeWebSDK.WebChatClient({
    config: {
      bot_id: '7700979632833052707',
    },
    componentProps: {
      title: 'Coze',
    },
    auth: {
      type: 'token',
      token: 'pat_********',
      onRefreshToken: function () {
        return 'pat_********'
      }
    }
  });
</script>', 
                onRefreshToken: function () {
                    return '<script src="https://lf-cdn.coze.cn/obj/unpkg/flow-platform/chat-app-sdk/1.2.0-beta.19/libs/cn/index.js"></script>
<script>
  new CozeWebSDK.WebChatClient({
    config: {
      bot_id: '7700979632833052707',
    },
    componentProps: {
      title: 'Coze',
    },
    auth: {
      type: 'token',
      token: 'pat_********',
      onRefreshToken: function () {
        return 'pat_********'
      }
    }
  });
</script>'
                }
            }
        });
    </script>
</body>
</html>
